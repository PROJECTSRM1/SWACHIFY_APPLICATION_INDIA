name: Auto Deploy – Swachify Frontend (PREPROD)

on:
  push:
    branches:
      - preprod1

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Pull latest PREPROD code
        run: |
          cd /home/projects/services/SWACHIFY_APPLICATION_INDIA
          git checkout preprod1
          git fetch origin preprod1
          git reset --hard origin/preprod1

      - name: Show latest commit
        run: |
          cd /home/projects/services/SWACHIFY_APPLICATION_INDIA
          git log -1 --oneline

      - name: Install dependencies (clean)
        run: |
          cd /home/projects/services/SWACHIFY_APPLICATION_INDIA
          npm ci

      - name: Build frontend
        run: |
          cd /home/projects/services/SWACHIFY_APPLICATION_INDIA
          rm -rf dist
          npm run build

      - name: Deploy dist to PREPROD Nginx folder
        run: |
          sudo mkdir -p /var/www/swachify-qa
          sudo rm -rf /var/www/swachify-qa/*
          sudo cp -r /home/projects/services/SWACHIFY_APPLICATION_INDIA/dist/* /var/www/swachify-qa/
          sudo chmod -R 755 /var/www/swachify-qa

      - name: Test & Reload Nginx
        run: |
          sudo nginx -t
          sudo systemctl reload nginx || sudo systemctl restart nginx



