name: Auto Deploy – Swachify Frontend (QA)

on:
  push:
    branches:
      - qa

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Pull latest QA code
        run: |
          cd /home/projects/services/SWACHIFY_APPLICATION_INDIA
          git fetch --all
          git checkout qa
          git pull origin qa

      - name: Install dependencies
        run: |
          cd /home/projects/services/SWACHIFY_APPLICATION_INDIA
          npm install

      - name: Build frontend
        run: |
          cd /home/projects/services/SWACHIFY_APPLICATION_INDIA
          npm run build

      - name: Deploy dist to QA Nginx folder
        run: |
          sudo rm -rf /var/www/swachify-qa/*
          sudo cp -r /home/projects/services/SWACHIFY_APPLICATION_INDIA/dist/* /var/www/swachify-qa/

      - name: Reload Nginx
        run: |
          sudo systemctl reload nginx
