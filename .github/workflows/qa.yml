name: Auto Deploy – Swachify Frontend (PREPROD)

on:
  push:
    branches:
      - preprod1

jobs:
  deploy:
    name: Deploy Swachify Frontend (PREPROD)
    runs-on: self-hosted

    steps:
      # 1️⃣ Checkout PREPROD branch
      - name: Checkout PREPROD branch
        uses: actions/checkout@v4
        with:
          ref: preprod1
          fetch-depth: 0

      # 2️⃣ Show commit (debug proof)
      - name: Show latest commit
        run: |
          echo "=== DEPLOYING COMMIT ==="
          git log -1 --oneline

      # 3️⃣ Install dependencies (lockfile NOT required)
      - name: Install dependencies
        run: |
          npm install

      # 4️⃣ Build frontend
      - name: Build frontend
        run: |
          rm -rf dist
          npm run build
          echo "=== BUILD OUTPUT ==="
          ls -la dist | head -20

      # 5️⃣ Deploy to PREPROD Nginx folder
      - name: Deploy to PREPROD Nginx folder
        run: |
          sudo mkdir -p /var/www/swachify-qa
          sudo rm -rf /var/www/swachify-qa/*
          sudo cp -r dist/* /var/www/swachify-qa/
          sudo chown -R www-data:www-data /var/www/swachify-qa
          sudo chmod -R 755 /var/www/swachify-qa

      # 6️⃣ Test & Reload Nginx safely
      - name: Test & Reload Nginx
        run: |
          sudo nginx -t
          sudo systemctl reload nginx
